/* ---------- tokens ---------- */

  --shadow: 0 8px 24px rgba(31,35,40,.16); --shadow-sm: 0 1px 2px rgba(31,35,40,.06);

    --side-bg: #1f1830; --side-text: #ece7f6;
    --ok: #3fb950; --warn: #d29922; --danger: #f85149; --info: #58a6ff; --violet: #bc8cff; --orange: #f0883e;

  }
}
:root[data-theme="dark"] {
  --bg: #121114; --surface: #1a191d; --surface-2: #232227; --surface-3: #2c2b31;
  --border: #323137; --border-strong: #46444d;
  --text: #ecebee; --text-muted: #9a97a1;
  --accent: #bcb3de; --accent-hover: #d2cbee; --accent-contrast: #1f1230; --link: #c9c0ea;
  --side-bg: #1f1830; --side-text: #ece7f6;

[data-palette="lime"] { --accent: #525174; --accent-hover: #403f5e; --accent-contrast: #ffffff; --link: #2a7590; --side-bg: #bce784; --side-text: #1a2410;
  --k1: #5dd39e; --k1t: #0c2a1d; --k2: #2f7e99; --k2t: #ffffff; --k3: #525174; --k3t: #ffffff; --k4: #513b56; --k4t: #ffffff; }
:root[data-palette="lime"][data-theme="dark"] { --accent: #5dd39e; --accent-hover: #7fe0b4; --accent-contrast: #0c2a1d; --link: #6cc3de; --side-bg: #1d2a14; --side-text: #e6f5d2; }

  --k1: #8c1322; --k1t: #ffffff; --k2: #dc2f4a; --k2t: #ffffff; --k3: #f26b8a; --k3t: #3a0a14; --k4: #f49cba; --k4t: #3a0a14; }
:root[data-palette="rose"][data-theme="dark"] { --accent: #f26b8a; --accent-hover: #f79cb2; --accent-contrast: #3a0a14; --link: #f58aa3; --side-bg: #12282d; --side-text: #dff3f7; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/20px var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
  stroke-linejoin: round; vertical-align: -3px; }
.ic.lg { width: 28px; height: 28px; stroke-width: 1.6; }
.muted { color: var(--text-muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.grow { flex: 1; min-width: 0; } .toolbar > .grow { flex: 1 1 260px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 200; padding: 12px 16px; min-height: 44px; border-radius: var(--radius-sm);
  background: var(--accent); color: var(--accent-contrast); font-weight: 600; text-decoration: none; }
.skip:focus { top: 10px; }
main:focus { outline: none; }
.side .navbtn { display: none; }
code { background: var(--surface-2); padding: 0 5px; border-radius: 4px; font: 12px var(--mono); overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
kbd { font: 11.5px/16px var(--mono); background: var(--surface-2); border: 1px solid var(--border-strong); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 5px; white-space: nowrap; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 2px; }
/* ---------- controls ---------- */
input[type=text], input[type=search], input[type=number], input:not([type]), select, textarea { background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 5px 8px; min-height: 32px; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0;
  border-color: var(--accent); }
textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; line-height: 18px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface-2);
  border-radius: var(--radius-sm); padding: 5px 12px; min-height: 32px; cursor: pointer; white-space: nowrap; text-decoration: none;
  color: var(--text); transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.small { padding: 2px 8px; font-size: 12.5px; min-height: 26px; }
.btn.icon { padding: 5px 7px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn[aria-busy=true] { pointer-events: none; opacity: .85; }
.btn[aria-busy=true] > .ic { display: none; }
.btn[aria-busy=true]::before, .spin { content: ''; display: inline-block; width: 14px; height: 14px; flex: none; border-radius: 50%;
  border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin .7s linear infinite; }
.spin { vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
label.tog { display: flex; gap: 10px; align-items: center; padding: 5px 0; flex-wrap: wrap; }
input[type=checkbox].sw { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border-strong);
  position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
input[type=checkbox].sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
input[type=checkbox].sw:checked { background: var(--accent); }
input[type=checkbox].sw:checked::after { transform: translateX(14px); }
/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.app.rail { --side-w: 60px; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side-bg); color: var(--side-text); display: flex;
  flex-direction: column; z-index: 25; }
.brand { display: flex; align-items: center; gap: 10px; padding: 10px 14px; height: var(--head-h); text-decoration: none; color: var(--side-text);
  white-space: nowrap; overflow: hidden; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand .m1 { fill: var(--side-text); } .brand .m2 { fill: var(--side-bg); } .brand .m3 { fill: none; stroke: var(--side-bg); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -.2px; display: block; line-height: 17px; }
.brand b i { font-style: normal; opacity: .85; }
.brand small { font-size: 11.5px; opacity: .85; font-weight: 600; }
.nav { flex: 1; overflow: auto; padding: 8px; }
.nav h6 { margin: 12px 8px 4px; font-size: 12px; color: color-mix(in srgb, var(--side-text) 76%, transparent); font-weight: 600; }
.nav h6:first-child { margin-top: 4px; }
.tab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; cursor: pointer;
  border-radius: var(--radius-sm); color: color-mix(in srgb, var(--side-text) 90%, transparent); text-align: left; white-space: nowrap; position: relative; }
.tab:hover { background: color-mix(in srgb, var(--side-text) 10%, transparent); color: var(--side-text); }
.tab.on { background: color-mix(in srgb, var(--side-text) 17%, transparent); color: var(--side-text); font-weight: 600; }
.tab .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tab .n { color: var(--side-text); font-size: 11.5px; font-weight: 600; background: color-mix(in srgb, var(--side-text) 9%, transparent); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.tab .n.hot { background: color-mix(in srgb, var(--danger) 78%, black); color: white; }   /* darkened so white keeps 4.5:1 in dark */
.side-foot { border-top: 1px solid color-mix(in srgb, var(--side-text) 14%, transparent); padding: 8px; display: flex; gap: 4px; align-items: center; }
.side-foot .ver { margin-left: auto; font-size: 11.5px; opacity: .8; padding-right: 6px; }
.side-foot .btn { color: color-mix(in srgb, var(--side-text) 80%, transparent); } .side-foot .btn:hover { background: color-mix(in srgb, var(--side-text) 12%, transparent); color: var(--side-text); }
.side :focus-visible { outline-color: var(--side-text); }
@media (min-width: 901px) {
.app.rail .brand { padding: 10px 13px; } .app.rail .brand span, .app.rail .nav h6, .app.rail .tab .lbl, .app.rail .side-foot .ver,
.app.rail .side-foot .hide-rail { display: none; }
.app.rail .nav h6 + .tab { margin-top: 8px; } .app.rail .tab { justify-content: center; padding: 9px 0; }
.app.rail .tab .n { position: absolute; top: 2px; right: 4px; font-size: 10px; padding: 0 4px; line-height: 14px; }
.app.rail .tab .n:not(.hot) { display: none; } .app.rail .side-foot { flex-direction: column; }
}
.mainc { min-width: 0; display: flex; flex-direction: column; }
.head { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; flex-wrap: wrap; min-height: var(--head-h); }
.src { flex: 1 1 340px; display: flex; gap: 6px; min-width: 0; }
.field { flex: 1; min-width: 0; position: relative; display: flex; }
.field .ic { position: absolute; left: 9px; top: 8px; color: var(--text-muted); pointer-events: none; }
.field input { flex: 1; min-width: 0; padding-left: 30px; font-family: var(--mono); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); white-space: nowrap; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
/* Waiver (playbook I1, pulsing dot): it shows a live state, the text says "running n%", and reduced motion stops it. */
.pill.running { color: var(--info-fg); border-color: var(--info); } .pill.running::before { animation: pulse 1s ease-in-out infinite; }
.pill.done { color: var(--ok-fg); border-color: var(--ok); }
.pill.failed, .pill.offline { color: var(--danger-fg); border-color: var(--danger); }
.pill.idle, .pill.loading { color: var(--text-muted); }
@keyframes pulse { 50% { opacity: .25; } }
.menu { position: relative; }
.menu summary { list-style: none; } .menu summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 4px; z-index: 30; min-width: 280px; }
.menu .pop button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.menu .pop button:hover { background: var(--surface-2); }
.menu .pop span { display: block; font-size: 12px; color: var(--text-muted); white-space: normal; }
/* run strip: stages, live counts, progress */
.runbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px 8px; align-items: center; position: relative; }
.runbar:empty { display: none; }
.stage { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2);
  color: var(--text-muted); white-space: nowrap; }
.stage .ic { width: 12px; height: 12px; stroke-width: 3; }
.stage.on { background: color-mix(in srgb, var(--info) 18%, var(--surface)); color: var(--info-fg); font-weight: 600; }
.stage.past { color: var(--ok-fg); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.stage.bad { color: var(--danger-fg); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.runmeta { font-size: 12px; color: var(--text-muted); white-space: nowrap; margin-left: 4px; font-variant-numeric: tabular-nums; }
.counts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-left: 10px; }
@media (max-width: 900px) { .counts { margin-left: 0; padding-left: 0; } }
.counts .lv { cursor: pointer; }
.runline { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent; }
.runline i { display: block; height: 100%; background: var(--info); transition: width .3s; }
.runline.done i { background: var(--ok); } .runline.failed i { background: var(--danger); }
/* global activity bar */
.topprog { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .2s; }
.topprog.on { opacity: 1; }
.topprog i { position: absolute; top: 0; bottom: 0; width: 35%; background: var(--accent); border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { left: -35%; } to { left: 100%; } }
main { padding: 16px; max-width: 1560px; width: 100%; margin: 0 auto; flex: 1; }
.panel { display: none; } .panel.on { display: block; }   /* no fade: sections switch many times a day, often by key */
@keyframes fade { from { opacity: 0; transform: translateY(3px); } }
.foot { padding: 10px 16px 14px; font-size: 12px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }
.foot a { color: inherit; }
/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px;
  box-shadow: var(--shadow-sm); }
.card h2 { margin: 0 0 10px; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card h2 .muted { font-weight: 400; }
.card > p:last-child { margin-bottom: 0; }
details.card > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; font-weight: 600; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary > .ic:first-child { transition: transform .15s; color: var(--text-muted); }
details.card[open] > summary > .ic:first-child { transform: rotate(90deg); }
details.card[open] > summary { margin-bottom: 10px; }
details.card > summary .muted { font-weight: 400; }
.ptitle { font-size: 20px; font-weight: 700; margin: 0 0 12px; letter-spacing: -.2px; }
.inv h2 .pill { font-size: 12px; }
.holders { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hold { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px;
  padding: 2px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hold b { font-weight: 600; } .hold .ic { width: 14px; height: 14px; }
.hold.done { color: var(--ok-fg); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.hold.listing { color: var(--info-fg); border-color: var(--info); background: color-mix(in srgb, var(--info) 8%, var(--surface)); }
.hold.waiting { color: var(--text-muted); border-style: dashed; }
.hold.partial { color: var(--warn-fg); border-color: var(--warn); }
.pagehead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.pagehead h2 { margin: 0; font-size: 18px; flex: 1; min-width: 200px; }
.pagehead p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-muted); font-weight: 400; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.kpi:nth-child(4n+1) { --kb: var(--k1); --kt: var(--k1t); } .kpi:nth-child(4n+2) { --kb: var(--k2); --kt: var(--k2t); }
.kpi:nth-child(4n+3) { --kb: var(--k3); --kt: var(--k3t); } .kpi:nth-child(4n+4) { --kb: var(--k4); --kt: var(--k4t); }
@media (hover: hover) and (pointer: fine) { .kpi:hover { box-shadow: var(--shadow); } }
.kpi:active { transform: scale(.97); }
.kpi b { display: block; font-size: 28px; line-height: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
.kpi.zero b { font-weight: 400; }   /* a zero is shown lighter in weight, not in contrast */
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; font-size: 12.5px; text-align: left; }

<script>
'use strict';
const TOKEN = '__TOKEN__';
const LEVELS = ['error', 'review', 'warning', 'decision', 'change', 'not_loaded', 'info'];
const LEVEL_LABEL = {error: 'Errors', review: 'To review', warning: 'Warnings', decision: 'Tool decisions', change: 'Changes',
  not_loaded: 'Not loaded', info: 'Info'};
const LEVEL_COLOR = {error: 'var(--danger)', review: 'var(--orange)', warning: 'var(--warn)', decision: 'var(--info)', change: 'var(--violet)',
  not_loaded: 'var(--border-strong)', ok: 'var(--ok)'};
const STAGES = [['files', 'Read & classify files'], ['clients', 'Build clients'], ['registers', 'Link registers'],
  ['finance', 'Fees & open items'], ['compliance', 'Compliance'], ['documents', 'Documents'], ['checks', 'Template checks'],
  ['write', 'Write files']];
const NAV = [['Run', [['overview', 'Overview', 'grid'], ['decide', 'Needs decision', 'flag'], ['ai', 'AI assistant', 'spark'], ['flow', 'Data flow', 'flow']]],
  ['Inspect', [['journal', 'Journal', 'list'], ['records', 'Records', 'card'], ['files', 'Files & columns', 'columns'],
    ['review', 'Review rows', 'clipboard'], ['values', 'Changes & not loaded', 'swap'], ['finance', 'Finance', 'bank']]],
  ['Configure', [['settings', 'Settings', 'sliders'], ['docs', 'Docs', 'book']]]];
const TABS = NAV.flatMap(g => g[1]);
const SHORTCUTS = [['Ctrl K', 'Search and commands: sections, mandates, rules, guides'], ['Ctrl Enter', 'Run the migration'],
  ['/', 'Focus the search of the section'], ['[  ]', 'Previous / next section'], ['1 … 9, 0', 'Jump to a section by its position'],
  ['↑  ↓', 'Previous / next event while the details are open'], ['Esc', 'Close details, dialogs and menus'], ['?', 'This list']];

const S = {run: null, state: 'loading', events: [], next: 0, summary: null, trace: null, info: null, tab: 'overview', started: null, source: null,
  filter: {levels: new Set(['error', 'review', 'warning', 'decision', 'change', 'not_loaded']), q: '', stage: '', code: '',
  file: '', follow: true, limit: 1500}, record: null, recQ: '', valuesMode: 'change', valuesCol: '', timer: null, browsePath: null, ai: null,
  aiStatus: null, aiTimer: null, offline: false, dirty: false, decQ: '', filesQ: '', filesUnmapped: false, docs: null, doc: null, docQ: '',
  drawerSeq: null, drawerList: null, watching: false};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = n => (n ?? 0).toLocaleString();
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const panel = tab => $(`[data-tab=${tab}]`);
const dl = (file, run = S.run) => `/api/download?run=${run}&file=${encodeURIComponent(file)}&token=${TOKEN}`;
const store = {get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }};
const empty = (icon, title, text = '', action = '') => `<div class="empty">${ic(icon, 'lg')}<b>${title}</b>${text}${action ? `<div>${action}</div>` : ''}</div>`;
const skeleton = () => `<div class="kpis">${'<div class="sk kpi-sk"></div>'.repeat(6)}</div><div class="sk block"></div><div class="sk" style="width:60%"></div><div class="sk" style="width:40%"></div>`;
const secs = t => t < 60 ? `${t.toFixed(1)} s` : `${Math.floor(t / 60)} min ${Math.round(t % 60)} s`;

// ---------- feedback: activity bar, toasts, busy buttons ----------
let pending = 0, pendTimer = null;
function activity(delta) { pending = Math.max(0, pending + delta); clearTimeout(pendTimer);
  if (pending) pendTimer = setTimeout(() => $('#topprog').classList.add('on'), 180); else $('#topprog').classList.remove('on'); }
async function api(path, body, opt = {}) {
  const o = {headers: {'X-Token': TOKEN}};
  if (body !== undefined) { o.method = 'POST'; o.body = JSON.stringify(body); o.headers['Content-Type'] = 'application/json'; }
  if (!opt.quiet) activity(1);
  try {
    let res;
    try { res = await fetch(path, o); }
    catch (e) { const err = new Error('The tool is not answering. Is it still running? (bin/m2ctl.sh status)'); err.offline = true; throw err; }
    const data = await res.json().catch(() => ({error: res.statusText}));
    if (!res.ok) { const err = new Error(data.error || res.statusText); err.status = res.status; throw err; }
    return data;
  } finally { if (!opt.quiet) activity(-1); }
}
const TOAST_ICON = {success: 'check', error: 'alert', warn: 'warn', info: 'info'};
function toast(msg, opt = {}) {
  if (typeof opt === 'number') opt = {ms: opt};
  const type = opt.type || 'info'; const box = $('#toasts');
  const t = document.createElement('div'); let timer;
  const close = () => { clearTimeout(timer); t.classList.add('out'); setTimeout(() => t.remove(), 200); };
  const paint = (m, o) => { const ty = o.type || 'info'; const ms = o.ms ?? (ty === 'error' ? 8000 : ty === 'busy' ? 0 : o.action ? 7000 : 4000);
    t.className = 'toast ' + ty; t.setAttribute('role', ty === 'error' ? 'alert' : 'status');
    t.innerHTML = `${ty === 'busy' ? '<span class="spin"></span>' : ic(TOAST_ICON[ty] || 'info')}<div class="msg">${esc(m)}${o.detail ? `<small>${esc(o.detail)}</small>` : ''}</div>
      ${o.action ? `<button class="btn small" data-act>${esc(o.action.label)}</button>` : ''}<button class="btn ghost icon small" data-x title="Dismiss">${ic('x')}</button>
      ${ms ? `<i class="life" style="animation-duration:${ms}ms"></i>` : ''}`;
    $('[data-x]', t).onclick = close; const a = $('[data-act]', t); if (a) a.onclick = () => { close(); o.action.fn(); };
    clearTimeout(timer); if (ms) { timer = setTimeout(close, ms); t.onmouseenter = t.onfocusin = () => clearTimeout(timer); t.onmouseleave = t.onfocusout = () => { timer = setTimeout(close, 1500); }; } };
  paint(msg, {...opt, type}); box.append(t);
  [...box.children].slice(0, -3).filter(x => !x.classList.contains('busy')).forEach(x => x.querySelector('[data-x]')?.click());   // three at most: older ones close
  while (box.children.length > 5) box.firstElementChild.remove();
  return {close, update: (m, o = {}) => paint(m, o)};
}
/* one toast that follows a slow action: spinner while it goes, then the result */
async function track(label, promise, done, opt = {}) {
  const t = toast(label, {type: 'busy'});
  try { const r = await promise; t.update(typeof done === 'function' ? done(r) : done, {type: 'success', ...opt}); return r; }
  catch (e) { t.update(e.message, {type: 'error'}); throw e; }
}
async function busy(btn, fn) {
  if (!btn || btn.getAttribute('aria-busy') === 'true') return;
  btn.setAttribute('aria-busy', 'true');
  try { return await fn(); } finally { btn.removeAttribute('aria-busy'); }
}
async function copy(text, what = 'Copied') { try { await navigator.clipboard.writeText(text); toast(what, {type: 'success', ms: 1800}); }
  catch (e) { toast('The browser did not allow copying.', {type: 'warn'}); } }

// ---------- derived data ----------
function counts() { const c = {}; LEVELS.forEach(l => c[l] = 0); S.events.forEach(e => c[e.level]++); return c; }
function byKey() { const m = new Map(); S.events.forEach(e => { if (e.key) { if (!m.has(e.key)) m.set(e.key, []); m.get(e.key).push(e); } }); return m; }
const cleanFile = f => String(f || '').replace(/ \[.*\]$/, '');
function decisionsNeeded() {
  const g = {company: new Map(), employee: new Map(), kind: [], column: [], notfound: [], legal: new Map(), func: [], other: []};
  for (const e of S.events) {
    if (e.code === 'COMPANY_UNKNOWN') { const k = e.value || ''; if (!g.company.has(k)) g.company.set(k, {keys: [], alts: e.alternatives || []}); g.company.get(k).keys.push(e.key); }
    else if (e.code === 'EMPLOYEE_UNKNOWN') { const k = e.value; if (!g.employee.has(k)) g.employee.set(k, []); g.employee.get(k).push(e.key); }
    else if (e.code === 'KIND_UNKNOWN' || (e.code === 'KIND' && e.level === 'warning')) g.kind.push(e);
    else if (e.code === 'COLUMN_UNUSED') g.column.push(e);
    else if (e.code === 'CLIENT_NOT_FOUND') g.notfound.push(e);
    else if (e.code === 'ENTITY_TYPE_UNKNOWN') { const m = /legal form '([^']*)'/.exec(e.message); const k = m ? m[1] : '?';
      if (!g.legal.has(k)) g.legal.set(k, []); g.legal.get(k).push(e.key); }
    else if (e.code === 'OFFICER_FUNCTION_UNKNOWN') g.func.push(e);
    else if (['DUPLICATE_REF', 'ROW_INVALID', 'FILE_UNREADABLE', 'NO_MANDATES', 'CRASH', 'ADDRESS_MISSING', 'AMOUNT_NO_CURRENCY',
              'IBAN_CHECK', 'TYPE_UNKNOWN', 'ENTITY_TYPE_CHECK', 'SWIFT_FORMAT', 'CLIENT_IN_REVIEW', 'BANK_AMBIGUOUS',
              'COMPLIANCE_LOCK', 'NO_CLIENT_COLUMN', 'FOLDER_NOT_CLIENT', 'DOCUMENTS_MISSING', 'LEI_RENEWAL_CONFLICT',
              'OFFICER_TYPE_INVALID', 'OPEN_ITEM_PAID_BUT_OPEN', 'ARCHIVE_FOLDER_UNKNOWN', 'ARCHIVE_NOT_MANDATE',
              'ARCHIVE_NO_FOLDER', 'ARCHIVE_HOLDER_MISSING'].includes(e.code)) g.other.push(e);
  }
  g.funcs = new Map(); g.func.forEach(e => { const k = e.value || '?'; if (!g.funcs.has(k)) g.funcs.set(k, []); g.funcs.get(k).push(e); });
  g.total = g.company.size + g.employee.size + g.kind.length + g.column.length + g.notfound.length + g.legal.size + g.func.length + g.other.length;
  return g;
}
/* what the settings already answer: a decision saved after this run, waiting for the next one */
function decided(type, key, kind) {
  const c = S.info?.config || {}; if (!key || key === '_help') return '';
  if (type === 'company') return c.company_map?.[key] || '';
  if (type === 'employee') return c.employee_map?.[key] || '';
  if (type === 'file_kind') return c.file_kinds?.[key] || '';
  if (type === 'officer_type') return c.officer_types?.[key] || '';
  if (type === 'alias') { for (const [f, cols] of Object.entries(c.extra_aliases?.[kind] || {})) if (Array.isArray(cols) && cols.includes(key)) return f; }
  return '';
}
function kindOfFile(file) { return (S.summary?.files || []).find(f => f.file === file)?.kind; }
// "3 decisions to save, 194 to fix at the source": the two kinds of open items, named for what the person does
function openWording(p = decisionProgress()) { const left = p.open - p.done; const parts = [];
  if (left) parts.push(`${fmt(left)} decision${left === 1 ? '' : 's'} to save`);
  if (p.other) parts.push(`${fmt(p.other)} to fix at the source`);
  return parts.join(', '); }
function decisionProgress(g = decisionsNeeded()) {
  let open = 0, done = 0; const add = v => { open++; if (v) done++; };
  g.company.forEach((_, h) => { if (h) add(decided('company', h)); });
  g.employee.forEach((_, a) => add(decided('employee', a)));
  g.kind.forEach(e => add(decided('file_kind', cleanFile(e.file))));
  g.column.forEach(e => { const k = kindOfFile(e.file); if (k) add(decided('alias', e.column, k)); });

  const codes = mode === 'change' ? ['VALUE_CHANGED'] : ['VALUE_NOT_LOADED', 'COLUMN_UNUSED'];
  const all = S.events.filter(e => codes.includes(e.code));
  const by = {}; all.forEach(e => { const c = e.column || '?'; by[c] = (by[c] || 0) + 1; });

// ---------- AI assistant ----------
const AI_LABEL = {alias: 'column → field', file_kind: 'file → kind', officer_type: 'type code → register', company: 'holder → company', legal_form: 'legal form → entity type'};
const AI_TASK = {suggest: 'Suggest decisions', documents: 'Classify documents', summary: 'Summary'};
const meter = c => { const pct = Math.round(100 * c); return `<span class="meter"><span class="bar"><i style="width:${pct}%;background:${pct >= 75 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--orange)'}"></i></span>${pct}%</span>`; };
function aiFind(type, key, kind) { return (S.ai?.suggestions || []).find(x => x.type === type && x.key === key && (!kind || x.kind === kind)); }
function aiHint(type, key, kind) {
  const x = aiFind(type, key, kind); if (!x) return '';
  const val = x.field || x.value; const pct = Math.round(100 * x.confidence);
  if (decided(type, key, kind) === val) return '';
  const accept = type === 'legal_form' ? '' : `<button class="btn small" data-ai-accept="${esc(JSON.stringify({type, key, kind: x.kind, value: val}))}">Accept</button>`;
  return `<span class="aihint" title="${esc(x.reason)}, ${esc(x.provider)} ${esc(x.model || '')}">${ic('spark')}<b>${esc(val)}</b> <span class="conf">${pct}%</span> ${accept}</span>`;
}
function bindAI(el) {
  const b = $('#askai', el); if (b) b.onclick = () => runAI(['suggest']);
  $$('[data-ai-accept]', el).forEach(btn => btn.onclick = () => { const d = JSON.parse(btn.dataset.aiAccept);
    const body = d.type === 'alias' ? {type: 'alias', key: d.key, kind: d.kind, field: d.value} : {type: d.type, key: d.key, value: d.value};
    busy(btn, () => decide(body, `${d.key} → ${d.value} saved (AI suggestion)`, {target: d.type, key: d.key, kind: d.kind, field: d.value})); });
}
function aiDocTypes(a) { if (a.document_types) return a.document_types; const m = {}; (a.documents || []).forEach(d => m[d.doc_type] = (m[d.doc_type] || 0) + 1); return m; }
function aiResume() { const j = S.ai?.job; if (!['interrupted', 'stopped', 'failed'].includes(j?.state)) return '';
  const left = (j.tasks || []).filter(t => !(j.done || []).includes(t)); if (!left.length) return '';
  const why = {interrupted: 'was cut off (the tool or the machine restarted)', stopped: 'was stopped', failed: 'stopped on an error'}[j.state];
  return `<div class="banner warn" style="margin:10px 0 0">${ic('warn')}<div><b>The assistant ${why} at ${(j.percent || 0).toFixed(1)}%.</b> Left: ${left.map(t => AI_TASK[t] || t).join(', ')}. Answers already given are kept and reused, so it goes on where it was.
    <div style="margin-top:8px"><button class="btn small primary" id="airesume">${ic('refresh')}Resume</button></div></div></div>`; }
function aiProgress() { const j = S.ai?.job; if (j?.state !== 'running') return '';
  const n = (j.tasks || []).length || 1, d = (j.done || []).length, el = j.started ? Math.max(0, (Date.now() - Date.parse(j.started)) / 1000) : 0;
  const pct = Math.max(0, Math.min(100, j.percent ?? 100 * d / n)), eta = j.eta ? `about ${secs(j.eta)} left in this step, ` : '';
  return `<div class="progress-row" style="margin-top:10px"><span class="spin"></span><span>${(j.tasks || []).map(t => `<span class="chip static ${(j.done || []).includes(t) ? 'on' : ''}">${(j.done || []).includes(t) ? ic('check') : ''} ${AI_TASK[t] || t}</span>`).join(' ')}</span>
    <div class="bar tall" role="progressbar" aria-label="Assistant progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-valuetext="${pct.toFixed(1)}%"><i style="width:${pct}%;background:var(--violet)"></i></div>
    <b class="num" style="min-width:6ch;text-align:right">${pct.toFixed(1)}%</b><span class="small muted">${j.step ? esc(j.step) + ', ' : ''}${j.reused ? `${fmt(j.reused)} saved answer(s) reused, ` : ''}${eta}${d} of ${n} task(s), ${secs(el)} so far</span>
    <button class="btn small" id="aistop" title="Stop after the current batch; finished tasks keep their results">${ic('x')}Stop</button></div>`; }
async function loadAI() {
  if (!S.run) return; const run = S.run; const was = S.ai?.job?.state;
  try { const light = was === 'running' && S.ai?.run === run;
    const r = await api(`/api/ai?run=${run}${light ? '&job=1' : ''}`, undefined, {quiet: true}); if (run !== S.run) return;
    S.ai = r.job?.state === 'running' && light ? {...S.ai, job: r.job} : r.job?.state !== 'running' && light ? await api(`/api/ai?run=${run}`, undefined, {quiet: true}) : r;
  } catch (e) { S.ai = null; }
  const now = S.ai?.job?.state; clearTimeout(S.aiTimer);
  if (now === 'running') S.aiTimer = setTimeout(loadAI, 1500);
  const bad = (S.ai?.calls || []).filter(c => !c.ok && (!S.ai.job?.started || (c.at || '') >= S.ai.job.started));
  if (was === 'running' && now === 'done' && bad.length) toast(`The assistant finished, but ${bad.length} model call(s) failed`, {type: 'warn', ms: 9000, detail: bad[0].error || '',
    action: S.tab === 'ai' ? null : {label: 'Open', fn: () => go('ai')}});
  else if (was === 'running' && now === 'done') toast('The assistant is done', {type: 'success', detail: `${(S.ai.suggestions || []).length} suggestion(s), ${fmt(S.ai.documents_total ?? (S.ai.documents || []).length)} document(s) typed.`,
    action: S.tab === 'ai' ? null : {label: 'Open', fn: () => go('ai')}});
  if (was === 'running' && now === 'failed') toast('The assistant stopped: ' + (S.ai.job.error || ''), {type: 'error'});
  if (was === 'running' && now === 'stopped') toast('The assistant stopped', {detail: `Finished: ${(S.ai.job.done || []).map(t => AI_TASK[t] || t).join(', ') || 'nothing yet'}.`});
  if (now === 'running' && was === 'running') { const p = $('#aiprog'); if (p) { p.innerHTML = aiProgress(); bindAIStop(); return; } }
  if (['ai', 'decide', 'overview', 'flow'].includes(S.tab)) softRender(); else renderShell();
}
function bindAIStop() { const b = $('#aistop'); if (!b) return;
  b.onclick = async () => { b.disabled = true; try { await api('/api/ai/stop', {run: S.run}); toast('Stopping after the current batch…'); } catch (e) { toast(e.message, {type: 'error'}); b.disabled = false; } }; }
async function runAI(tasks, resume) {
  if (!S.run || S.state === 'running') return toast('Wait for the run to finish.', {type: 'warn'});
  try { const r = await api('/api/ai/run', {run: S.run, tasks, resume: !!resume}); tasks = r.tasks;
    S.ai = {...(S.ai || {}), run: S.run, job: {state: 'running', tasks, done: [], started: new Date().toISOString()}};
    toast(resume ? 'The assistant goes on where it stopped…' : 'The assistant is working on this machine…', {detail: tasks.map(t => AI_TASK[t]).join(', ')}); softRender(); clearTimeout(S.aiTimer); S.aiTimer = setTimeout(loadAI, 800); }
  catch (e) { toast(e.message, {type: 'error'}); }
}

async function poll() {
  if (!S.run) return; const run = S.run; const before = S.state;
  try {
    let more = true;

      S.events.push(...r.events); S.next = r.next; S.state = r.state; S.summary = r.summary; S.trace = r.trace; S.started = r.started; S.source = r.source; more = r.events.length >= 5000; }
    if (S.offline) { S.offline = false; toast('Connected again', {type: 'success', ms: 2000}); }
  } catch (e) {
    if (e.offline) { S.offline = true; renderShell(); S.timer = setTimeout(poll, 2500); return; }
    toast(e.message, {type: 'error'}); S.state = 'failed';
  }
  if (S.state === 'running') { softRender(); S.timer = setTimeout(poll, 400); return; }
  if (S.watching) { S.watching = false; const t = S.summary?.totals; const dn = decisionsNeeded().total;
    if (S.state === 'done') toast('Run finished', {type: dn ? 'warn' : 'success', detail: `${fmt(t?.import)} to import, ${fmt(t?.review)} to review${dn ? `; ${openWording()}` : ''}`,
      action: dn ? {label: 'Needs decision', fn: () => go('decide')} : {label: 'Overview', fn: () => go('overview')}});
    else toast('The run stopped', {type: 'error', detail: 'See the traceback at the top of the page and run.log.'}); }
  render(); loadRuns(S.run).catch(() => {});
  try { S.info = await api('/api/state', undefined, {quiet: true}); } catch (e) { /* keeps the last settings */ }
  render(); loadAI();
}

async function startRun() {

  if (!source) { toast('Choose the folder with the M2 exports first.', {type: 'warn', action: {label: 'Browse…', fn: () => browse()}}); $('#source').focus(); return; }

  if (S.starting) return; S.starting = true; renderShell();
  try { const r = await api('/api/run', {source}); loadRuns(r.run).catch(() => {}); S.filter.follow = true; go('journal'); await openRun(r.run, true); }

}

$('#palbtn').onclick = palOpen;
$('#keysbtn').onclick = () => $('#keys').classList.add('on');
$('#keylist').innerHTML = SHORTCUTS.map(([k, d]) => `<span>${k.split('  ').map(x => `<kbd>${x}</kbd>`).join(' ')}</span><span>${d}</span>`).join('');
$('#themebtn').onclick = cycleTheme;
$('#palettebtn').onclick = cyclePalette;
$('#railbtn').onclick = () => { const on = $('#app').classList.toggle('rail'); store.set('m2rail', on ? '1' : ''); };
$('#dclose').onclick = () => $('#drawer').classList.remove('on');
$('#dprev').onclick = () => stepEvent(-1); $('#dnext').onclick = () => stepEvent(1);
$('#dcopy').onclick = () => { const e = S.events.find(x => x.seq === S.drawerSeq); if (e) copy(JSON.stringify(e, null, 2), 'Event copied as JSON'); };
$('#run').onclick = startRun;
$('#source').onkeydown = ev => { if (ev.key === 'Enter') startRun(); };
$('#source').onchange = () => loadInventory();
$('#runs').onchange = ev => { if (ev.target.value) openRun(ev.target.value); };
$('#browse').onclick = () => browse();
$('#pclose').onclick = () => $('#picker').classList.remove('on');
$('#puse').onclick = () => { $('#source').value = S.browsePath; $('#picker').classList.remove('on'); loadInventory(); toast('Folder chosen', {type: 'success', ms: 5000, detail: S.browsePath, action: {label: 'Run migration', fn: startRun}}); };
$('#sample-en').onclick = () => sample(true);
$('#sample').onclick = () => sample(false);
window.M2 = {S, go, api, toast, render};   // for the browser console and for agents driving the page

// ---------- init ----------
(async () => {
  setTheme(store.get('m2theme', 'auto')); setPalette(store.get('m2palette', 'aubergine')); if (store.get('m2rail', '')) $('#app').classList.add('rail');
  new MutationObserver(labelScrollers).observe($('main'), {childList: true, subtree: true});   // also boxes drawn later
  loadInventory();
  if (!fromHash()) { S.tab = store.get('m2tab', 'overview'); if (!RENDER[S.tab]) S.tab = 'overview'; }
  render();
  try {
    S.info = await api('/api/state');
    $('#source').value = S.info.settings.source || '';
    const runs = await loadRuns();
    const asked = new URLSearchParams(location.search).get('run');
    const last = (asked && runs.some(r => r.id === asked) && asked) || S.info.running || runs[0]?.id;
    if (last) { $('#runs').value = last; await openRun(last, last === S.info.running); } else { S.state = 'idle'; render(); }
  } catch (e) { S.state = 'failed'; S.offline = !!e.offline; render(); toast(e.message, {type: 'error', ms: 0, action: {label: 'Reload', fn: () => location.reload()}}); }
})();
</script>
</body>
</html>
